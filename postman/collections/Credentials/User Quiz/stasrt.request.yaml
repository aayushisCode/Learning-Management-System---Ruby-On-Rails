$kind: http-request
name: stasrt
url: 'http://localhost:3000/api/user_courses/{{user_course_id}}/quizzes/{{quiz_id}}/start'
method: POST
order: 2000
headers:
  Authorization: 'Bearer {{jwt_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      if (pm.response.code === 201 && res.user_quiz_id) {
        pm.collectionVariables.set("user_quiz_id", res.user_quiz_id);
        console.log("user_quiz_id saved:", res.user_quiz_id);
      }
