$kind: http-request
name: '2 answer'
url: 'http://localhost:3000/api/user_quizzes/{{user_quiz_id}}/answer'
method: POST
order: 1000
headers:
  Authorization: 'Bearer {{jwt_token}}'
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "answer": {
        "question_id": "{{question_id}}",
        "option_id": "{{option_id}}"
      }
    }
