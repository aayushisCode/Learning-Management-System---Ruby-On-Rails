$kind: http-request
url: http://localhost:3000/users/sign_in
method: POST
body:
  type: json
  content: |-
    {
      "user": {
        "email": "admin2@company.example",
        "password": "Test@123"
      }
    }
scripts:
  - type: afterResponse
    code: |-
      const authHeader = pm.response.headers.get("Authorization");

      if (authHeader) {
          const token = authHeader.replace(/^Bearer\s+/i, "").trim();

          if (token.split(".").length === 3) {
              pm.collectionVariables.set("jwt_token", token);
              console.log("Valid JWT saved successfully");
          } else {
              console.error("Invalid JWT format:", token);
          }
      } else {
          console.error("Authorization header missing from login response");
      }
    language: text/javascript
order: 1000
